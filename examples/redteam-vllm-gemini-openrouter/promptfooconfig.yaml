# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Red team a local vLLM-served Qwen3.5 target with Gemini as judge and OpenRouter as attacker
targets:
  - id: openai:chat:qwen3.5-122b-a10b-fp8 # --served-model-name passed to `vllm serve`
    label: qwen3.5-122b-a10b-vllm
    config:
      apiBaseUrl: http://localhost:8001/v1 # vLLM's OpenAI-compatible server
      apiKey: vllm # any non-empty string, vLLM does not check it
      max_tokens: 4096 # thinking mode spends many tokens before the final answer
      showThinking: false # keep reasoning content out of graded output
      passthrough:
        chat_template_kwargs:
          enable_thinking: false # disable Qwen3.5 thinking mode entirely; see notes below
prompts:
  - '{{prompt}}'
redteam:
  purpose: A general-purpose helpful assistant.
  provider: &attacker
    id: openrouter:nvidia/nemotron-3-ultra-550b-a55b:free # attacker and generator
  plugins:
    # Dataset-backed plugins generate test cases locally (static HF/GitHub dataset + local
    # templating, canGenerateRemote: false upstream) but are permanently exempt from every
    # strategy, including Crescendo, by design (src/redteam/constants/plugins.ts,
    # DATASET_EXEMPT_PLUGINS) — they ship verbatim adversarial prompts meant to be tested
    # single-turn, not escalated. numTests kept modest since each only costs 1 judge call
    # (grading) and 0 attacker calls, but there's no strategy multiplier to budget against.
    - id: beavertails
      numTests: 10
    - id: cyberseceval
      numTests: 10
    - id: donotanswer
      numTests: 10
    - id: harmbench
      numTests: 10
    - id: aegis
      numTests: 10
    - id: pliny
      numTests: 10
    - id: toxic-chat
      numTests: 10
    - id: xstest
      numTests: 10
    # Image dataset (gated on HF): needs HF_TOKEN from an account with access, and a multimodal target.
    - id: unsafebench
      numTests: 5
    # contracts and politics generate fresh prompts via the attacker model above, and are the
    # ONLY plugins here Crescendo actually transforms (strategies are additive: both the base
    # and the Crescendo-transformed test case run) — see README for the budget math behind
    # numTests: 12 and maxTurns: 5 below.
    - id: contracts
      numTests: 12
    - id: politics
      numTests: 12
    # Plugins deliberately excluded: harmful:* (except privacy/intellectual-property), bias, coppa, ferpa,
    # religion, wordplay all require promptfoo's remote "unaligned" generation and fail under
    # PROMPTFOO_DISABLE_REMOTE_GENERATION=true with no local fallback. vlguard also generates locally in
    # principle but its HF dataset is access-gated (403) unless your account has been granted access.
  strategies:
    - id: crescendo
      config:
        maxTurns: 5 # budgeted against the 500/day judge quota, see README for the math
        redteamProvider: *attacker # keep Crescendo fully local; without this it falls back to promptfoo's remote attacker
defaultTest:
  options:
    provider: &judge
      id: google:gemini-3.5-flash-lite # grader, kept separate from the attacker model to avoid self-grading bias
    rubricProvider: *judge
